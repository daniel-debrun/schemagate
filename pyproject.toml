[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadriftgate"
version = "0.1.0"
description = "Governed schema mapping for sender-controlled spreadsheets: deterministic first, model last, nothing published without a recorded human decision."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel De Brun" }]
requires-python = ">=3.10"
keywords = ["schema-matching", "data-governance", "etl", "llm", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
bench-agent = ["mcp>=2.2,<3"]
excel = ["openpyxl>=3.1"]
duckdb = ["duckdb>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "openpyxl>=3.1",
  "duckdb>=1.1",
]

[project.scripts]
schemagate = "schemagate.cli:main"

[project.urls]
Homepage = "https://github.com/daniel-debrun/schemagate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schemagate = ["llm/prompts/*.txt", "schema/data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
